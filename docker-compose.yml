# Spins up the two Postgres databases the app and tests expect.
# Usage:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: menuos
      POSTGRES_PASSWORD: menuos
      POSTGRES_DB: menuos
    ports:
      - "5432:5432"
    volumes:
      - menuos_pgdata:/var/lib/postgresql/data
      # Create the test database on first init.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  menuos_pgdata:
